name: Publicar site

# Corre sempre que mudas alguma coisa no repositório (ex.: carregas uma música)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para saber quando cada música foi adicionada

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler as músicas e montar o site
        run: |
          pip install --quiet mutagen pillow
          python scripts/gerar_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
